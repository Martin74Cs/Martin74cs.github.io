name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Automatické spouštění každý den o půlnoci pro synchronizaci nově přidaných poznámek z Obsidianu
  schedule:
    - cron: '0 0 * * *'
  # Umožní ruční spuštění aktualizace tlačítkem v GitHub záložce Actions
  workflow_dispatch:
  # Umožní automatické spuštění signálem z repozitáře Obsidian
  repository_dispatch:
    types: [obsidian_updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web repository
        uses: actions/checkout@v4

      - name: Checkout Obsidian repository for latest notes
        uses: actions/checkout@v4
        with:
          repository: 'Martin74Cs/Obsidian'
          path: '../Obsidian'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project and sync Obsidian
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
